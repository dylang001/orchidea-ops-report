<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Orchidea · Daily brief</title>
  <link rel="icon" href="orchidea-wordmark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body class="tab-board grain-today">
  <a class="skip" href="#panel-board">Skip to report</a>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
          <img class="logo" src="orchidea-wordmark.png" width="166" height="50" alt="Orchidea" />
        <div>
          <div class="brand-name" id="brand-name">Orchidea</div>
          <p class="subtitle" id="subtitle">Outbound GTM ops</p>
        </div>
      </div>
      <nav class="tocnav" aria-label="Report sections">
        <button type="button" data-tab="board" aria-pressed="true">Overview</button>
        <button type="button" data-tab="fleet">Bot fleet</button>
        <button type="button" data-tab="focus">Focus</button>
        <button type="button" data-tab="radar">Radar</button>
      </nav>
      <div class="mast-meta" id="hero-window">
        <strong>Africa/Johannesburg</strong>
        <span>as of …</span>
      </div>
    </div>
  </header>

  <div class="kpi-band">
    <div class="kpi-band-inner" id="hero-stats"></div>
  </div>

  <main class="page">
    <section id="panel-board" class="panel active"></section>
    <section id="panel-fleet" class="panel" hidden></section>
    <section id="panel-focus" class="panel" hidden></section>
    <section id="panel-radar" class="panel" hidden></section>
    <footer id="footer"></footer>
  </main>

  <div id="drawer" hidden>
    <div class="drawer-scrim" data-close-drawer></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <div>
          <p class="drawer-kicker" id="drawer-kicker"></p>
          <h2 id="drawer-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close-drawer aria-label="Close details">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script>
    (function () {
      var data = document.createElement("script");
      data.src = "data.js?t=" + Date.now();
      data.onload = function () {
        var app = document.createElement("script");
        app.src = "app.js?v=18";
        document.body.appendChild(app);
      };
      data.onerror = function () {
        document.body.insertAdjacentHTML(
          "afterbegin",
          "<p class='load-error'>data.js did not load. Serve this folder with python3 -m http.server 43147</p>"
        );
      };
      document.body.appendChild(data);
    })();
  </script>
</body>
</html>
